# HOSPEDAGEM_HOSTINGER.md §5 e DECISOES §15/§28: a cada push na main, confere o código, gera a
# imagem, publica no GHCR (privado) e atualiza o VPS. Sem os segredos do VPS, para na publicação.
name: deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, packages: write }
concurrency: { group: deploy, cancel-in-progress: false }

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: nuvem, POSTGRES_PASSWORD: nuvem-dev, POSTGRES_DB: nuvemleads }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nuvem" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nuvem:nuvem-dev@localhost:5432/nuvemleads_test
      DATABASE_URL: postgresql://nuvem:nuvem-dev@localhost:5432/nuvemleads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          {
            registry: ghcr.io,
            username: "${{ github.actor }}",
            password: "${{ secrets.GITHUB_TOKEN }}",
          }
      - uses: docker/build-push-action@v6
        with:
          push: true
          # o nome da imagem no GHCR precisa ser minúsculo
          tags: ghcr.io/allanvieiramidias-lgtm/nuvemleads:latest,ghcr.io/allanvieiramidias-lgtm/nuvemleads:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    env:
      HAS_VPS: ${{ secrets.VPS_HOST != '' && secrets.VPS_SSH_KEY != '' }}
    steps:
      - if: env.HAS_VPS != 'true'
        run: echo "Segredos VPS_HOST/VPS_SSH_KEY ainda não configurados; imagem publicada, VPS não atualizado."
      - if: env.HAS_VPS == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: cd ~/nuvemleads && docker compose pull app && docker compose up -d && docker image prune -f
