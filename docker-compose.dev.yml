# Só para desenvolvimento local: Postgres 16 em localhost:5432
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nuvemleads
      POSTGRES_USER: nuvem
      POSTGRES_PASSWORD: nuvem-dev
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata-dev:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuvem -d nuvemleads"]
      interval: 5s
      retries: 10
volumes:
  pgdata-dev:
